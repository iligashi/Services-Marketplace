# Render Blueprint (free tier): API, admin dashboard and Redis-compatible Key Value.
# MySQL is not offered on Render's free tier, so the API connects to an
# external MySQL-compatible database (e.g. TiDB Cloud's free tier) through DATABASE_URL.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# JWT secrets are generated by Render; the database URL (plus DB_SSL_CA for a
# provider with a private CA),
# Stripe keys and the first admin are entered once in the dashboard.
#
# Free-tier limits: the API sleeps after 15 minutes without traffic (first
# request takes ~1 minute) and has no persistent disk, so uploaded photos are
# lost on every deploy or restart. Move to the Starter plan with a disk, or
# object storage, before real users upload photos.
services:
  # ------------------------------------------------------------------ API
  - type: web
    name: marketplace-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    # Pre-deploy commands need a paid plan; migrations and bootstrap are idempotent
    startCommand: npm run migrate && npm run bootstrap && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketplace-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_URL
        fromService:
          type: web
          name: marketplace-admin
          property: host
      - key: PLATFORM_FEE_PERCENT
        value: "12"
      # Entered in the dashboard when the Blueprint is created
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ------------------------------------------------------------- Admin UI
  - type: web
    name: marketplace-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: marketplace-api
          property: host

  # ---------------------------------------------------- Redis (Key Value)
  - type: keyvalue
    name: marketplace-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # private network only
