# Render Blueprint: API, admin dashboard, MySQL and Redis-compatible Key Value.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Secrets are generated by Render (database, JWT) or entered once in the
# dashboard (Stripe, first admin); none of them live in this file.
services:
  # ------------------------------------------------------------------ API
  - type: web
    name: marketplace-api
    runtime: node
    plan: starter            # always on (free instances sleep and drop sockets) and allows a disk
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate && npm run bootstrap
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_HOST
        fromService:
          type: pserv
          name: marketplace-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: services_marketplace
      - key: DB_USER
        fromService:
          type: pserv
          name: marketplace-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: marketplace-mysql
          envVarKey: MYSQL_PASSWORD
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketplace-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_URL
        fromService:
          type: web
          name: marketplace-admin
          property: host
      - key: PLATFORM_FEE_PERCENT
        value: "12"
      # Entered in the dashboard when the Blueprint is created
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ------------------------------------------------------------- Admin UI
  - type: web
    name: marketplace-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: marketplace-api
          property: host

  # ---------------------------------------------------------------- MySQL
  - type: pserv
    name: marketplace-mysql
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./infra/mysql/Dockerfile
    dockerContext: ./infra/mysql
    autoDeploy: false
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: services_marketplace
      - key: MYSQL_USER
        value: services_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # ---------------------------------------------------- Redis (Key Value)
  - type: keyvalue
    name: marketplace-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # private network only
